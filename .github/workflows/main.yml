name: Create Release Zip

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update Version
        run: |
          echo "// This file is auto-generated. Do not modify." > ./Runtime/HypelineVersion.cs
          echo "namespace MuxyHypeline" >> ./Runtime/HypelineVersion.cs
          echo "{" >> ./Runtime/HypelineVersion.cs
          echo "    class Constants { public const string Version = \"${{ github.ref_name }}\"; }" >> ./Runtime/HypelineVersion.cs
          echo "}" >> ./Runtime/HypelineVersion.cs
          cat ./Runtime/HypelineVersion.cs
          mkdir .MuxyHypeline
          cp -r * .MuxyHypeline/
          mv .MuxyHypeline MuxyHypeline
          zip -r "MuxyHypeline-${{github.ref_name}}.zip" MuxyHypeline/* -x ".git/*" ".github/*"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: Muxy Hypeline ${{ github.ref_name }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifacts: "MuxyHypeline-${{github.ref_name}}.zip"